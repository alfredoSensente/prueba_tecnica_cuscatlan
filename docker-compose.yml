services:
  postgres:
    image: postgres:16-alpine
    container_name: reserva-postgres
    environment:
      POSTGRES_DB: reserva
      POSTGRES_USER: reserva
      POSTGRES_PASSWORD: reserva
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva -d reserva"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reserva-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
